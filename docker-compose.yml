# ./docker-compose.yml
services:
  db:
    container_name: tsugi_db
    image: ${TSUGI_DB_IMAGE:-mariadb:10.5}
    environment:
      MYSQL_ROOT_PASSWORD: tsugi_root_pw
      MYSQL_DATABASE: tsugi
      MYSQL_USER: ltiuser
      MYSQL_PASSWORD: ltipassword
    ports:
      - "33306:3306"
    volumes:
      - ./.docker_data/mysql:/var/lib/mysql:delegated
  web:
    container_name: tsugi_web
    build:
        context: .
    depends_on:
      - db
    environment:
      TSUGI_ADMIN_PW: ${TSUGI_ADMIN_PW:-}
      TSUGI_PDO: ${TSUGI_PDO:-}
      TSUGI_DB_USER: ${TSUGI_DB_USER:-}
      TSUGI_DB_PASS: ${TSUGI_DB_PASS:-}
      TSUGI_WWWROOT: ${TSUGI_WWWROOT:-}
      TSUGI_APPHOME: ${TSUGI_APPHOME:-}
      TSUGI_DEMO_LOGIN: ${TSUGI_DEMO_LOGIN:-}
      TSUGI_DEMO_SECRET: ${TSUGI_DEMO_SECRET:-}
    volumes:
      # Bind-mount the tree for dev, then overlay config.php so a host config.php
      # (MAMP / local.dj4e.com) is not what Apache loads. The short nested-file
      # syntax is listed by inspect but not mounted on Docker Desktop.
      - type: bind
        source: .
        target: /var/www/html/tsugi
      - type: bind
        source: ./docker/tsugi-docker-config.php
        target: /var/www/html/tsugi/config.php
        read_only: true
    ports:
      # Host port (CI and docs default to 8888). Override locally, e.g. TSUGI_HOST_PORT=8000, to avoid MAMP.
      - "${TSUGI_HOST_PORT:-8888}:80"
    command: bash -c "./tsugi/docker-compose-init.sh"
    stdin_open: true
    tty: true
